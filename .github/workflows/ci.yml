name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Quarry has zero dependencies — there is nothing to install.
      - name: Run tests
        run: node --test test/*.test.ts
      # Typecheck gate (finding V5). The TypeScript compiler is CI-only
      # tooling: it is installed with --no-save, so package.json keeps no
      # dependencies and no devDependencies, and the shipped runtime stays
      # zero-dependency Node built-ins only.
      - name: Typecheck
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.9.3 @types/node@22.20.7
          ./node_modules/.bin/tsc --noEmit
